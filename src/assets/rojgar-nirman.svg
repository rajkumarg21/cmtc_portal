<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5F5"/>
      <stop offset="100%" stop-color="#F0F8FF"/>
    </linearGradient>

    <!-- Radial glow behind text -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFDAB9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Ribbon path style -->
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4C1EC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#3CB371"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="200" fill="url(#bgGrad)" rx="15"/>

  <!-- Glow behind text -->
  <circle cx="300" cy="80" r="60" fill="url(#glow)"/>

  <!-- Decorative curved ribbon behind text -->
  <path d="M50 140 C 150 100, 450 100, 550 140 L 550 160 L 50 160 Z" fill="url(#ribbonGrad)" opacity="0.7"/>

  <!-- Accent dots -->
  <circle cx="100" cy="50" r="4" fill="#F4C1EC" opacity="0.6"/>
  <circle cx="500" cy="60" r="4" fill="#3CB371" opacity="0.6"/>
  <circle cx="200" cy="30" r="3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="400" cy="40" r="3" fill="#FFFFFF" opacity="0.5"/>

  <!-- Main title -->
  <text x="50%" y="85" font-family="Noto Sans Devanagari, Mangal, Devanagari, sans-serif" 
        font-size="48" fill="#A41616" font-weight="800" text-anchor="middle">
    रोज़गार और निर्माण
  </text>

  <!-- Subtext -->
  <text x="50%" y="125" font-family="Arial, sans-serif" font-size="24" fill="#696969" text-anchor="middle">
    साप्ताहिक
  </text>
</svg>
